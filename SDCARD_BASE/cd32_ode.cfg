# CD32 ODE Settings File
# Edit this file on the SD card to configure the drive emulator.
# Lines starting with # or ; are comments.
# Changes take effect on next boot.

# --- WiFi (Pico 2 W only) ---
# Leave wifi_ssid blank to disable the web interface.
wifi_ssid       =
wifi_password   =
wifi_hostname   = cd32ode

# --- Logging ---
logging_enabled = 1
log_commands    = 1
log_sectors     = 0
log_seeks       = 1
log_state       = 1
log_errors      = 1
log_irq         = 0
log_max_kb      = 4096
