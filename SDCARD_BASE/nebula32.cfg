# CD32 ODE Settings File
# Edit this file on the SD card to configure the drive emulator.
# Lines starting with # or ; are comments.
# Changes take effect on next boot.
#
# --- Disc image location ---
# Directory scanned for .iso/.bin/.nrg/.mdf disc images.
# Must start with the FatFS volume prefix (0:/) and end with /.
# Default is the SD card root. Change to a subdirectory to keep
# the root tidy, e.g. 0:/games/
sdcard_base     = 0:/
#
# --- Logging ---
logging_enabled = 1
log_commands    = 1
log_sectors     = 0
log_seeks       = 1
log_state       = 1
log_errors      = 1
log_irq         = 0
log_max_kb      = 4096
#
# --- Carousel / playlists ---
# playlist_save_ms: delay in MILLISECONDS (the _ms suffix) to wait
# after the last playlist-menu step before saving the choice to
# flash. Spinning the knob fast coalesces into one write.
# Value is in ms: 1500 = 1.5 seconds. 0 = save immediately; max 60000.
playlist_save_ms = 1500
#
# --- WiFi ---
# Leave wifi_ssid blank to disable the web interface.
# wifi_hostname sets the mDNS name (access as hostname.local).
# wifi_ssid     = MyNetwork
# wifi_password = MyPassword
wifi_hostname   = nebula32
#
# --- Firmware Update Security ---
# fw_token is required to authorise firmware flashing via the web UI.
# Set it to any 32-character hex string (generated on first webserver start
# if left blank). Copy the value from this file into your browser or curl.
# fw_token      =
